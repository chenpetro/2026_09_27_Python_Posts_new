<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Random number (cached for 20 seconds): {{ random_number }}</h1>

    <p>Cache timeout: 20 seconds</p>
</body>
